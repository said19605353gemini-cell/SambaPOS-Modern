name: Build & Release SambaPOS Modern

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Publish Samba.ModernServer (win-x64)
        run: |
          dotnet publish SourceCode/Samba.ModernServer/Samba.ModernServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Package Release Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-pkg/wwwroot | Out-Null
          Copy-Item ./publish/Samba.ModernServer.exe ./release-pkg/
          Copy-Item ./*.bat ./release-pkg/
          Copy-Item ./appsettings.json ./release-pkg/
          Copy-Item ./wwwroot/* ./release-pkg/wwwroot/ -Recurse -Force
          Compress-Archive -Path ./release-pkg/* -DestinationPath ./SambaPOS-Modern-win-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SambaPOS-Modern-win-x64
          path: ./SambaPOS-Modern-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SambaPOS Modern v1.0.${{ github.run_number }}
          files: ./SambaPOS-Modern-win-x64.zip
          generate_release_notes: true
