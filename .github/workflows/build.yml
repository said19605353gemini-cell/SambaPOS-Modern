name: Build SambaPOS Modern

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          include-prerelease: true

      - name: Publish Samba.ModernServer (win-x64)
        run: |
          dotnet publish SourceCode/Samba.ModernServer/Samba.ModernServer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SambaPOS-Modern-win-x64
          path: |
            ./publish/Samba.ModernServer.exe
            ./*.bat
            ./appsettings.json
            ./wwwroot/**
