<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Garson Mobil El Terminali - SambaPOS</title>
    <script src="/lib/tailwind.js"></script>
    <script src="/lib/signalr.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Garson Mobil Başlık Barı -->
    <header class="bg-indigo-950/80 border-b border-indigo-800/60 px-5 py-3 flex items-center justify-between sticky top-0 z-40 shadow-lg backdrop-blur">
        <div class="flex items-center space-x-3">
            <span class="h-9 w-9 bg-indigo-500 rounded-xl flex items-center justify-center font-black text-slate-950 text-lg">🤵</span>
            <div>
                <h1 class="text-base font-black text-white flex items-center gap-1.5">
                    Garson Terminali
                    <span class="text-[10px] bg-emerald-500/20 text-emerald-400 font-bold px-2 py-0.5 rounded-full border border-emerald-500/30">Canlı</span>
                </h1>
                <p class="text-[11px] text-indigo-300">Mutfak Çıktıları • Masa Siparişi</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <span id="garson-name-badge" class="text-xs bg-indigo-900 border border-indigo-700 px-2.5 py-1 rounded-lg font-bold text-indigo-200">Garson: Ali</span>
        </div>
    </header>

    <!-- Mutfaktan Yeni Çıkan Pişmiş Yemekler Bildirim Barı -->
    <div id="ready-dishes-bar" class="bg-emerald-950/80 border-b border-emerald-800/80 px-4 py-2.5 flex items-center justify-between text-xs text-emerald-200 font-bold">
        <div class="flex items-center gap-2">
            <span class="text-base animate-bounce">🔔</span>
            <span id="ready-status-text">Mutfak dinleniyor, hazır yemekler burada gözükür.</span>
        </div>
        <span id="ready-time" class="text-[10px] text-emerald-400 font-mono"></span>
    </div>

    <!-- Garsonun Hızlı Masaları & Sipariş Alma Bölümü -->
    <main class="flex-1 p-4 overflow-y-auto space-y-4">
        <!-- Masa Seçimi -->
        <div>
            <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">Masa Seçin:</h2>
            <div class="grid grid-cols-4 sm:grid-cols-6 gap-2" id="garson-tables"></div>
        </div>

        <!-- Hızlı Ürün Seçimi -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">Menüden Ekle:</h2>
                <span id="target-table-label" class="text-xs font-black text-amber-400">Seçili: Masa 1</span>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5" id="garson-menu"></div>
        </div>
    </main>

    <!-- Garson Sepeti & Mutfağa Fırlat Barı -->
    <footer class="bg-slate-900 border-t border-slate-800 p-4 sticky bottom-0 z-40">
        <div class="flex items-center justify-between mb-3 text-xs">
            <div>
                <span class="text-slate-400">Garson Sepeti:</span>
                <strong id="garson-cart-summary" class="text-white ml-1 font-bold">0 Kalem</strong>
            </div>
            <div class="text-right">
                <span class="text-slate-400">Toplam:</span>
                <strong id="garson-cart-total" class="text-emerald-400 font-black text-base ml-1">0,00 ₺</strong>
            </div>
        </div>
        <button onclick="sendGarsonOrder()" id="garson-send-btn" disabled class="w-full bg-slate-800 text-slate-500 font-black py-3.5 rounded-xl text-sm transition-all shadow-lg flex items-center justify-center gap-2 cursor-not-allowed">
            <span>👨‍🍳</span> Masanın Siparişini Mutfağa Gönder
        </button>
    </footer>

    <!-- Sesli Bildirim ve SignalR -->
    <script>
        const quickMenu = [
            { id: 1, name: "Urfa Kebap", price: 340, vat: 10, icon: "🍢" },
            { id: 2, name: "İskender Kebap", price: 380, vat: 10, icon: "🥩" },
            { id: 3, name: "Çıtır Lahmacun", price: 95, vat: 10, icon: "🫓" },
            { id: 4, name: "Mercimek Çorbası", price: 90, vat: 10, icon: "🍲" },
            { id: 5, name: "Künefe (Kaymaklı)", price: 180, vat: 10, icon: "🍯" },
            { id: 6, name: "Yayık Ayranı", price: 35, vat: 10, icon: "🥛" }
        ];

        let selectedTable = "Masa 1";
        let garsonCart = [];

        // Masaları Listele
        const tGrid = document.getElementById("garson-tables");
        for (let i = 1; i <= 16; i++) {
            const btn = document.createElement("button");
            btn.className = `py-2 rounded-xl text-xs font-bold border transition ${i === 1 ? 'bg-indigo-600 text-white border-indigo-500 font-black shadow-md' : 'bg-slate-900 border-slate-800 text-slate-300'}`;
            btn.textContent = `M${i}`;
            btn.onclick = () => {
                document.querySelectorAll("#garson-tables button").forEach(b => {
                    b.className = "py-2 rounded-xl text-xs font-bold border bg-slate-900 border-slate-800 text-slate-300";
                });
                btn.className = "py-2 rounded-xl text-xs font-bold border bg-indigo-600 text-white border-indigo-500 font-black shadow-md";
                selectedTable = `Masa ${i}`;
                document.getElementById("target-table-label").textContent = `Seçili: ${selectedTable}`;
            };
            tGrid.appendChild(btn);
        }

        // Menü Ürünlerini Listele
        const mGrid = document.getElementById("garson-menu");
        quickMenu.forEach(item => {
            const c = document.createElement("div");
            c.className = "bg-slate-900 border border-slate-800 p-3 rounded-xl active:scale-95 transition cursor-pointer flex flex-col justify-between";
            c.innerHTML = `
                <div>
                    <span class="text-xl">${item.icon}</span>
                    <h4 class="font-bold text-white text-xs mt-1 leading-snug">${item.name}</h4>
                </div>
                <div class="mt-2 flex items-center justify-between">
                    <span class="text-amber-400 font-extrabold text-xs">${item.price} ₺</span>
                    <span class="bg-indigo-600 text-white text-[10px] font-black px-2 py-0.5 rounded">+</span>
                </div>
            `;
            c.onclick = () => {
                const ex = garsonCart.find(x => x.id === item.id);
                if (ex) ex.quantity++;
                else garsonCart.push({ ...item, quantity: 1 });
                updateCart();
            };
            mGrid.appendChild(c);
        });

        function updateCart() {
            const total = garsonCart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const count = garsonCart.reduce((sum, i) => sum + i.quantity, 0);
            document.getElementById("garson-cart-summary").textContent = `${count} Kalem`;
            document.getElementById("garson-cart-total").textContent = total.toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + " ₺";

            const btn = document.getElementById("garson-send-btn");
            if (count > 0) {
                btn.disabled = false;
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-500 active:scale-98 text-white font-black py-3.5 rounded-xl text-sm transition-all shadow-xl flex items-center justify-center gap-2 cursor-pointer";
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-slate-800 text-slate-500 font-black py-3.5 rounded-xl text-sm transition-all shadow-lg flex items-center justify-center gap-2 cursor-not-allowed";
            }
        }

        async function sendGarsonOrder() {
            if (garsonCart.length === 0) return;
            const payload = {
                tableNumber: selectedTable,
                waiterName: "Garson Ali (El Terminali)",
                items: garsonCart.map(i => ({
                    menuItemName: i.name,
                    quantity: i.quantity,
                    price: i.price,
                    vatRate: i.vat,
                    status: "Bekliyor"
                }))
            };

            await fetch("/api/orders", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            garsonCart = [];
            updateCart();
            alert(`${selectedTable} siparişi mutfağa fırlatıldı!`);
        }

        // ================= SIGNALR MUTFAK BİLDİRİMİ =================
        const conn = new signalR.HubConnectionBuilder().withUrl("/hubs/pos").withAutomaticReconnect().build();
        conn.on("ItemStatusChanged", (data) => {
            if (data.status === "Hazır") {
                playGarsonZil();
                document.getElementById("ready-status-text").innerHTML = `🔥 <strong class="text-white">${data.tableNumber}: ${data.ItemName}</strong> PİŞTİ! Hemen servise alınız.`;
                document.getElementById("ready-time").textContent = data.Time || "";
                document.getElementById("ready-dishes-bar").className = "bg-emerald-600 px-4 py-2.5 flex items-center justify-between text-xs text-white font-extrabold shadow-lg animate-pulse";
            }
        });

        function playGarsonZil() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.setValueAtTime(1318.51, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) { }
        }
        conn.start();
    </script>
</body>
</html>
